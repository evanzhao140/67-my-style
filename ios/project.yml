name: MCVibe
options:
  bundleIdPrefix: com.mcvibe
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"

targets:
  MCVibe:
    type: application
    platform: iOS
    sources:
      - path: MCVibe
        excludes:
          - Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mcvibe.app
        PRODUCT_NAME: MCVibe
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: MCVibe/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_EMIT_LOC_STRINGS: NO

schemes:
  MCVibe:
    build:
      targets:
        MCVibe: all
    run:
      config: Debug
    archive:
      config: Release
