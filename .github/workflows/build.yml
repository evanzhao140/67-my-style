name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  mod:
    name: Build Fabric mod
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Build mod
        working-directory: mod
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: plantapi-mod-jar
          path: mod/build/libs/plantapi-*.jar
          if-no-files-found: error

  ios:
    name: Build iOS app (unsigned IPA)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Build unsigned archive
        run: |
          xcodebuild \
            -project ios/MCVibe.xcodeproj \
            -scheme MCVibe \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/MCVibe.xcarchive" \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package IPA
        run: |
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$RUNNER_TEMP/MCVibe.xcarchive/Products/Applications/MCVibe.app" "$RUNNER_TEMP/Payload/"
          cd "$RUNNER_TEMP"
          zip -qry MCVibe.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: MCVibe-ipa
          path: ${{ runner.temp }}/MCVibe.ipa
          if-no-files-found: error
